name = "goodgrails-seller"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# Account ID (not a credential; the API token itself must be a GitHub/Wrangler secret)
account_id = "954612afb5a97bb15dddcdc70176813d"

# D1: single authoritative inventory database
[[d1_databases]]
binding = "DB"
database_name = "bookstore-db"
database_id = "a6958759-920f-464b-9eb8-9d44257cfe3b"

# R2: actual-copy photographs and exports
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "bookstore-assets"

# KV: optional config/cache
[[kv_namespaces]]
binding = "CONFIG"
id = "602c9367a7794c73b52dcc9fe1cb3e1e"

# Workers AI (optional; heuristics are NOT labelled AI enrichment without it)
# [ai]
# binding = "AI"

[vars]
FRONTEND_URL = "https://goodgrails-seller.tradesprior.workers.dev"
ADMIN_URL = "https://goodgrails-seller.tradesprior.workers.dev"
ENVIRONMENT = "production"

# ==================== SECRETS ====================
# Set with:  wrangler secret put <NAME>
# NEVER put real values in this file.
#
# Required to use the dashboard/admin API:
#   ADMIN_TOKEN                  bearer token for /api/admin/* and /
#
# Optional remote MCP (in-Worker /mcp):
#   MCP_PATH_SECRET              secret path token for /mcp/s/<secret> (no-auth
#                                connectors). If unset, /mcp needs ADMIN_TOKEN.
#
# Required only when a marketplace is actually enabled:
#   EBAY_CLIENT_ID, EBAY_CLIENT_SECRET, EBAY_REFRESH_TOKEN
#   EBAY_ENVIRONMENT             "sandbox" or "production"
#   ABEBOOKS_API_KEY, ABEBOOKS_API_SECRET
#   BIBLIO_API_KEY
#
# Legacy (not required for the bookseller): OPENAI_API_KEY, STRIPE_SECRET_KEY,
# JWT_SECRET, BLOCKCHAIN_PRIVATE_KEY, PINATA_JWT, CONTRACT_ADDRESS.
#
# The old repo exposed a Cloudflare API token in plaintext. Treat it as
# compromised: revoke it in the Cloudflare dashboard and issue a new one.

[env.development]
name = "goodgrails-seller-dev"

[env.development.vars]
FRONTEND_URL = "http://localhost:8787"
ADMIN_URL = "http://localhost:8787"
ENVIRONMENT = "development"

[[env.development.d1_databases]]
binding = "DB"
database_name = "bookstore-db"
database_id = "a6958759-920f-464b-9eb8-9d44257cfe3b"
